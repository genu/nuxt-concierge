name: ci

on:
  push:
    branches: [master, 1.x]
  pull_request:

# These jobs execute pull-request code, including from forks. Nothing here
# needs write access — pkg.pr.new comments via its GitHub App, not this token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm dev:prepare

      - run: pnpm lint

      # Gated as of spec 3, whose entire deliverable is types. Twelve errors
      # accumulated while this was unwired, including one that broke the
      # library's primary usage (an API route that enqueues and returns JSON).
      - run: pnpm typecheck

      - run: pnpm test:types

      - run: pnpm test

      - run: pnpm test:lifecycle
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - run: pnpm prepack

  # Publishes an installable preview build for every commit and PR.
  # Install with: pnpm add https://pkg.pr.new/nuxt-concierge@<sha>
  preview:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm dev:prepare

      - run: pnpm prepack

      - run: pnpm dlx pkg-pr-new@0.0.87 publish
