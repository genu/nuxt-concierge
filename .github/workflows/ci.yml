name: ci

on:
  push:
    branches: [master, 1.x]
  pull_request:

# These jobs execute pull-request code, including from forks. Nothing here
# needs write access — pkg.pr.new comments via its GitHub App, not this token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm dev:prepare

      - run: pnpm lint

      # Gated as of spec 3, whose entire deliverable is types. Twelve errors
      # accumulated while this was unwired, including one that broke the
      # library's primary usage (an API route that enqueues and returns JSON).
      - run: pnpm typecheck

      - run: pnpm test:types

      # Narrow guard on the public config surface: asserts the documented
      # minimal `concierge` configs are assignable to ModuleOptions, plus two
      # negative cases the playground's own config does not exercise.
      #
      # Retained alongside the broader `typecheck` above even though its
      # original rationale no longer holds — it existed because 12 pre-existing
      # typecheck errors made the full script unusable, and those are now fixed.
      # The negative cases still earn their place: `typecheck` only proves the
      # playground's one config compiles, not that a wrong one is rejected.
      - run: pnpm typecheck:public

      # Covers test/**/*.ts (#26) — neither `typecheck` (playground only) nor
      # `typecheck:public` (test/types only) reached test/unit or
      # test/lifecycle. This is what catches type errors in mock-heavy tests
      # like the module registration cases, which a passing runtime test does
      # not.
      - run: pnpm typecheck:tests

      - run: pnpm test
        env:
          # The retry conformance table runs its bullmq half only when a real
          # Redis is reachable (test/unit/retry-conformance.test.ts). Without
          # this the table silently degrades to memory-only in the one place it
          # is automated. `pnpm test` stays Redis-free locally, where the
          # variable is simply unset.
          REDIS_URL: redis://127.0.0.1:6379

      - run: pnpm test:lifecycle
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - run: pnpm prepack

      # `nuxt-module-build` wraps unbuild, whose `clean: true` wipes the whole
      # `dist/` directory — which is why `prepack` runs `build:client` LAST
      # (see package.json). Nothing else guards that ordering: get it wrong
      # and this step is the only thing standing between that regression and
      # a published tarball with no dashboard (a 404 at the DevTools tab for
      # every consumer).
      #
      # Deliberately NOT `npm pack --dry-run | grep dist/client`: `--dry-run`
      # still RUNS `prepack` (npm's own lifecycle hook), and vite's build
      # step unconditionally prints "../dist/client/index.html ..." to
      # stdout the moment `build:client` runs — which it does even under the
      # dangerous order, just before `nuxt-module-build build` wipes the
      # directory back out. Grepping combined stdout for that text matches
      # vite's build LOG, not the tarball manifest, so it cannot fail even
      # when `dist/client` is empty at pack time — confirmed by deliberately
      # reintroducing the dangerous order and watching that grep stay green
      # while `dist/client` was verifiably empty on disk. Packing for real
      # and listing the archive's actual contents with `tar` has no such log
      # noise to false-positive on.
      - name: Assert the published tarball contains the dashboard SPA
        run: |
          npm pack
          tar -tzf nuxt-concierge-*.tgz | grep -q 'package/dist/client/'
          rm -f nuxt-concierge-*.tgz

  # Publishes an installable preview build for every commit and PR.
  # Install with: pnpm add https://pkg.pr.new/nuxt-concierge@<sha>
  preview:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm dev:prepare

      - run: pnpm prepack

      - run: pnpm dlx pkg-pr-new@0.0.87 publish
